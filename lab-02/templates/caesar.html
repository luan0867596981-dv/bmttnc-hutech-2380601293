<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Caesar Cipher</title>
        <link href="http://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    </head>
    <body>
        <div class="container mt-4">
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <strong>Lỗi!</strong> {{ error }}
            </div>
            {% endif %}

            {% if result %}
            <div class="alert alert-success" role="alert">
                <strong>Kết quả mã hóa:</strong> {{ result }}
            </div>
            {% endif %}

            <table class="table table-bordered mt-3">
                <tr><td style="text-align: center; font-weight: bold; font-size: 25px;">CAESAR CIPHER</td></tr>
                <tr><td style="font-weight: bold; color: blue;">ENCRYPTION</td></tr>
                <tr>
                    <td>
                        <form method="POST" action="/encrypt">
                            <div class="mb-3">
                                <label class="form-label">Plain text:</label>
                                <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" 
                                       pattern="[A-Za-z0-9\s!.,?]+" title="Vui lòng chỉ nhập chữ cái, số hoặc các dấu cơ bản" required autofocus/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Key (Number):</label>
                                <input type="number" class="form-control" name="inputKeyPlain" placeholder="Input Key" min="0" required/>
                            </div>
                            <button type="submit" class="btn btn-primary">Encrypt</button>
                        </form>
                    </td>
                </tr>
                </table>
        </div>
    </body>
</html>
